services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blackhole
      POSTGRES_USER: blackhole
      POSTGRES_PASSWORD: blackholepass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackhole"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./agents/payloads:/app/payloads   # Module 3.1 shared payload output
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Module 5.2 offline AI co-pilot (optional, comment out to save resources)
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  ollama: